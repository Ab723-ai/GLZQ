<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>钢陆棋局 · 三十国志</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1319; color: #dbe3ec; overflow: hidden; font-size: 13px; }
#app { display: flex; flex-direction: column; height: 100vh; }
#topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 54px; background: #161b22; border-bottom: 1px solid #262e38; overflow-x: auto; }
#topbar::-webkit-scrollbar { height: 0; }
.brand { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #e8c15a; }
.divider { width: 1px; height: 22px; background: #2b3641; }
.ts-item { display: flex; align-items: center; gap: 5px; font-size: 12px; height: 26px; padding: 0 6px; border-radius: 4px; }
.ts-value { font-weight: 600; color: #dbe3ec; font-family: Consolas, monospace; font-size: 12px; }
.ts-value.gold { color: #e8c15a; }
.ts-label { font-size: 10px; color: #7d8b9b; }
#date-display { font-size: 14px; color: #e8c15a; min-width: 96px; }
.resource-dot { width: 9px; height: 9px; border-radius: 2px; }
.dot-steel { background: #6b95c9; } .dot-oil { background: #c99a4a; } .dot-equip { background: #c9b14a; } .dot-man { background: #b8c9d9; } .dot-pp { background: #a97bc9; } .dot-tech { background: #5b9cff; }
.mini-bar { width: 46px; height: 6px; background: #0d1218; border-radius: 3px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 3px; }
.mini-fill.green { background: linear-gradient(90deg, #1c7a43, #3fd07d); }
.mini-fill.blue { background: linear-gradient(90deg, #2a5fa8, #5b9cff); }
#nation-badge { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
#nation-badge .swatch { width: 12px; height: 12px; border-radius: 3px; }
#nation-badge .nation-name { font-weight: 700; color: #eaf1f8; font-size: 13px; }
#war-indicator { padding: 0 10px; height: 24px; line-height: 24px; border-radius: 4px; font-size: 11px; font-weight: 700; }
#war-indicator.peace { background: #1c242e; border: 1px solid #2b3641; color: #7d8b9b; }
#war-indicator.war { background: #3a1e1e; border: 1px solid #a8312a; color: #ff8a8a; }
.speed-group { margin-left: auto; display: flex; gap: 3px; }
.speed-btn { padding: 4px 10px; min-width: 32px; background: #1c242e; border: 1px solid #2b3641; border-radius: 4px; color: #9aa9b8; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.speed-btn:hover { background: #26303c; color: #dbe3ec; }
.speed-btn.active { background: #3a3118; border-color: #6b5a24; color: #ffd75e; }
#main { flex: 1 1 auto; display: flex; min-height: 0; }
#map-wrap { flex: 1 1 auto; position: relative; background: radial-gradient(ellipse at 45% 40%, #182029 0%, #0c1116 75%); overflow: hidden; }
#map { width: 100%; height: 100%; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map.hidden, #focus-tree-wrap.hidden { display: none; }
#map-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.map-ctrl { width: 32px; height: 32px; background: #161b22; border: 1px solid #2b3641; border-radius: 4px; color: #9aa9b8; font-size: 16px; font-weight: 700; cursor: pointer; }
.map-ctrl:hover { background: #26303c; color: #dbe3ec; }
#map-info { position: absolute; bottom: 10px; left: 10px; background: rgba(22,27,34,.85); padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #7d8b9b; z-index: 5; }
#focus-tree-wrap { position: absolute; inset: 0; overflow: auto; padding: 8px 20px 20px; background: radial-gradient(ellipse at 45% 40%, #182029 0%, #0c1116 75%); }
#focus-tree-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
#focus-tree-wrap::-webkit-scrollbar-thumb { background: #2b3641; border-radius: 5px; }
#focus-legend { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 12px; background: rgba(18,23,29,.96); border: 1px solid #2b3641; border-radius: 6px; margin-bottom: 10px; font-size: 10px; font-weight: 600; }
#focus-legend span { display: flex; align-items: center; gap: 4px; }
#focus-legend .lg-dot { width: 9px; height: 9px; border-radius: 2px; }
#focus-tree-canvas { position: relative; }
#focus-tree-svg { position: absolute; inset: 0; pointer-events: none; }
#focus-tree-nodes { position: absolute; inset: 0; }
.focus-line { fill: none; stroke: #2b3641; stroke-width: 2; }
.focus-line.done { stroke: #27AE60; stroke-width: 2.5; }
.focus-node { position: absolute; width: 110px; height: 54px; padding: 3px 6px; background: #1a222c; border: 2px solid #33414f; border-left-width: 3px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: all .15s; overflow: hidden; }
.focus-node:hover { border-color: #4a5b6d; transform: translateY(-1px); }
.focus-node.locked { opacity: .5; cursor: not-allowed; }
.focus-node.available { border-color: #3B7DD8; }
.focus-node.poor { border-color: #8a6d3b; }
.focus-node.active { border-color: #e8c15a; box-shadow: 0 0 10px rgba(232,193,90,.45); background: #221e12; }
.focus-node.done { border-color: #27AE60; background: #16241d; }
.focus-node.selected { outline: 2px solid #fff; outline-offset: 1px; }
.focus-title { font-size: 10px; font-weight: 700; color: #eaf1f8; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-meta { font-size: 8px; color: #7d8b9b; }
.focus-node.done .focus-meta { color: #3fd07d; }
.focus-node.active .focus-meta { color: #e8c15a; }
.focus-progress { height: 2px; background: #0d1218; border-radius: 1px; overflow: hidden; }
.focus-progress-fill { height: 100%; background: linear-gradient(90deg, #b8901f, #ffd75e); }
#sidebar { flex: 0 0 380px; width: 380px; background: #12171d; border-left: 1px solid #262e38; overflow-y: auto; display: flex; flex-direction: column; }
#sidebar::-webkit-scrollbar { width: 8px; }
#sidebar::-webkit-scrollbar-thumb { background: #2b3641; border-radius: 4px; }
.tab-bar { flex: 0 0 auto; display: flex; position: sticky; top: 0; z-index: 10; background: #12171d; border-bottom: 1px solid #262e38; }
.tab-btn { flex: 1; padding: 9px 0; background: none; border: none; border-bottom: 2px solid transparent; color: #7d8b9b; font-size: 10px; font-family: inherit; font-weight: 600; cursor: pointer; }
.tab-btn:hover { color: #dbe3ec; }
.tab-btn.active { color: #e8c15a; border-bottom-color: #e8c15a; }
.tab-content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.tab-content.hidden { display: none; }
.card { background: #181e26; border: 1px solid #262e38; border-radius: 8px; padding: 12px; }
.card h2 { font-size: 12px; letter-spacing: 2px; color: #7d8b9b; font-weight: 600; margin-bottom: 10px; }
.province { stroke: #0b0f14; stroke-width: 1; cursor: pointer; transition: filter .12s, stroke .12s, opacity .2s; }
.province:hover { filter: brightness(1.35); stroke: #fff; stroke-width: 1.5; }
.province.capital { stroke: #ffd75e; stroke-width: 1.5; stroke-dasharray: 3 2; }
.province.selected { stroke: #ffffff; stroke-width: 2; filter: brightness(1.4) drop-shadow(0 0 6px rgba(255,215,94,.9)); }
.province.dimmed { opacity: .15; }
.province.battle { stroke: #ff3b3b; stroke-width: 2; animation: battlePulse 0.9s infinite; }
.province.encircled { stroke: #ff8800; stroke-width: 1.5; stroke-dasharray: 3 2; }
@keyframes battlePulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
.province-label { fill: #ffffff; font-size: 4.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.85); stroke-width: 1.2px; letter-spacing: -0.2px; }
.province-vp { fill: #ffd75e; font-size: 5px; font-weight: 700; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.85); stroke-width: 1.2px; }
.province-units { fill: #fff; font-size: 6px; font-weight: 700; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.9); stroke-width: 2px; }
.province-battle-icon { fill: #ff3b3b; font-size: 8px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.swatch { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }
.swatch.big { width: 18px; height: 18px; margin-top: 0; border-radius: 4px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { background: #151b22; border: 1px solid #232c36; border-radius: 5px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; }
.stat .k { font-size: 11px; color: #7d8b9b; }
.stat .v { font-size: 12px; color: #d6e1ec; font-weight: 600; }
.stat .v.gold { color: #ffd75e; } .stat .v.red { color: #ff6b6b; } .stat .v.green { color: #3fd07d; }
.sec-title { font-size: 11px; color: #7d8b9b; letter-spacing: 1px; margin: 12px 0 6px; }
.res-row { display: flex; gap: 6px; flex-wrap: wrap; }
.res-tag { font-size: 11px; padding: 3px 8px; border-radius: 10px; }
.res-tag.steel { background: #2a3441; color: #9fc3ea; border: 1px solid #3b4c5f; }
.res-tag.oil { background: #332c1f; color: #e0b56a; border: 1px solid #55462a; }
.muted { color: #566270; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; }
.chip { padding: 3px 9px; margin: 0 4px 5px 0; border-radius: 12px; background: #232c37; border: 1px solid #33414f; color: #b9c7d6; font-size: 11px; cursor: pointer; font-family: inherit; }
.chip:hover { background: #2f3b49; color: #fff; }
.empty { font-size: 12px; color: #5c6774; padding: 16px 0; text-align: center; }
.bar-wrap { height: 6px; background: #0d1218; border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-fill.gold { background: linear-gradient(90deg, #b8901f, #ffd75e); }
.bar-fill.blue { background: linear-gradient(90deg, #2a5fa8, #5b9cff); }
.bar-fill.red { background: linear-gradient(90deg, #a8312a, #ff6b6b); }
.bar-fill.green { background: linear-gradient(90deg, #1c7a43, #3fd07d); }
.btn { display: block; width: 100%; padding: 8px 10px; margin-bottom: 6px; background: #232c37; border: 1px solid #33414f; border-radius: 6px; color: #dbe3ec; font-size: 12px; font-family: inherit; text-align: left; cursor: pointer; }
.btn:hover:not(:disabled) { background: #2f3b49; border-color: #4a5b6d; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn .btn-cost { float: right; color: #7d8b9b; font-size: 11px; }
.btn .btn-forecast { display: block; font-size: 10px; color: #9fc3ea; margin-top: 3px; }
.btn .btn-forecast.good { color: #3fd07d; }
.btn .btn-forecast.bad { color: #ff8a8a; }
.btn.danger { border-color: #6b2c2c; color: #ff8a8a; }
.btn.danger:hover:not(:disabled) { background: #3a1e1e; }
.btn.primary { border-color: #2a5fa8; color: #9fc3ea; }
.btn.primary:hover:not(:disabled) { background: #1e3350; }
.btn.small { padding: 5px 8px; font-size: 11px; margin-bottom: 4px; }
.btn.purple { border-color: #6b4a9a; color: #c9a5ff; }
.btn.purple:hover:not(:disabled) { background: #2a1e3f; }
.btn.teal { border-color: #16A085; color: #56B4E9; }
.btn.teal:hover:not(:disabled) { background: #143a3a; }
.queue-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #d6e1ec; font-weight: 600; }
.country-row { display: flex; gap: 9px; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
.country-row:hover { background: #1d2530; }
.country-row.active { background: #232d3a; border-color: #3d5266; }
.country-row.at-war { border-color: #6b2c2c; background: #2a1a1a; }
.country-row.dead { opacity: .4; }
.c-body { flex: 1; min-width: 0; }
.c-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.c-name { font-size: 12px; font-weight: 700; color: #eaf1f8; }
.c-badge { font-size: 10px; color: #7d8b9b; }
.c-line { font-size: 10px; color: #8393a4; line-height: 1.6; margin-top: 1px; }
.div-card { background: #151b22; border: 1px solid #232c36; border-radius: 6px; padding: 8px; margin-bottom: 6px; transition: all .15s; }
.div-card.selectable { cursor: pointer; }
.div-card.selectable:hover { border-color: #4a5b6d; }
.div-card.selected { border-color: #ffd75e; background: #221e12; }
.div-card.in-battle { border-color: #6b2c2c; }
.div-card.encircled { border-color: #ff8800; background: #2a1f14; }
.div-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.div-name { font-size: 12px; font-weight: 700; color: #eaf1f8; }
.div-id { font-size: 10px; color: #5c6774; }
.div-stat { font-size: 10px; color: #8393a4; margin-top: 3px; }
.div-check { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #4a5b6d; margin-right: 6px; font-size: 10px; color: transparent; flex-shrink: 0; }
.div-card.selected .div-check { border-color: #ffd75e; background: #ffd75e; color: #1a1a1a; }
.bulk-actions { display: flex; gap: 4px; margin-bottom: 6px; }
.bulk-actions .btn { flex: 1; margin: 0; padding: 5px 8px; font-size: 11px; text-align: center; }
.prov-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.prov-name { font-size: 16px; font-weight: 700; color: #f0f5fa; display: flex; align-items: center; gap: 8px; }
.cap-tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #3a3118; color: #ffd75e; border: 1px solid #6b5a24; }
.prov-owner { font-size: 12px; margin-top: 2px; }
.diplo-row { display: flex; gap: 9px; padding: 6px 8px; margin-bottom: 4px; background: #151b22; border: 1px solid #232c36; border-radius: 6px; }
.diplo-row.at-war { border-color: #6b2c2c; background: #2a1a1a; }
.diplo-row.surrendered-row { opacity: .5; }
/* 外交 3-Tab */
.diplo-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.diplo-tab { flex: 1; padding: 8px 4px; background: #151b22; border: 1px solid #232c36; border-radius: 4px; color: #7d8b9b; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
.diplo-tab:hover { background: #1d2530; color: #dbe3ec; }
.diplo-tab.active { background: #232d3a; border-color: #3d5266; color: #e8c15a; }
.diplo-tab.war.active { background: #3a1e1e; border-color: #a8312a; color: #ff8a8a; }
.diplo-tab.neighbor.active { background: #1e3a2f; border-color: #27AE60; color: #3fd07d; }
.diplo-list { display: flex; flex-direction: column; gap: 4px; }
.diplo-search { width: 100%; padding: 6px 10px; background: #1c242e; border: 1px solid #2b3641; border-radius: 4px; color: #dbe3ec; font-size: 12px; margin-bottom: 8px; }
#logbar { flex: 0 0 auto; height: 96px; background: #0e1217; border-top: 1px solid #262e38; padding: 8px 20px; overflow-y: auto; font-size: 12px; }
.log-line { line-height: 1.75; color: #8393a4; display: flex; gap: 8px; }
.log-line .log-day { color: #e8c15a; min-width: 84px; font-family: Consolas, monospace; font-size: 11px; }
.log-line.war { color: #ff8a8a; } .log-line.good { color: #3fd07d; } .log-line.diplo { color: #9fc3ea; } .log-line.info { color: #b8a5d8; }
.log-line.tech { color: #56B4E9; }
#tooltip { position: fixed; z-index: 3000; background: #0a0e12; border: 1px solid #3d5266; border-radius: 5px; padding: 6px 10px; font-size: 12px; color: #eaf1f8; max-width: 320px; line-height: 1.5; pointer-events: none; white-space: pre-line; }
#tooltip.hidden { display: none; }
.overlay { position: fixed; inset: 0; background: rgba(6,10,15,.85); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.overlay.hidden { display: none; }
.start-panel, .settings-panel, .endgame-panel, .event-panel { background: #161b22; border: 1px solid #3d5266; border-radius: 10px; padding: 32px 40px; max-width: 620px; max-height: 85vh; overflow-y: auto; }
.start-panel { min-width: 420px; text-align: center; }
.start-panel h2 { font-size: 26px; letter-spacing: 6px; color: #e8c15a; margin-bottom: 6px; }
.start-panel .sub { font-size: 12px; color: #7d8b9b; margin-bottom: 24px; letter-spacing: 2px; }
.start-btns { display: flex; flex-direction: column; gap: 10px; }
.start-btn { padding: 12px 24px; border-radius: 6px; font-size: 14px; font-family: inherit; font-weight: 600; letter-spacing: 2px; cursor: pointer; background: #232c37; border: 1px solid #33414f; color: #dbe3ec; }
.start-btn:hover:not(:disabled) { background: #2f3b49; }
.start-btn.primary { background: #1e3350; border-color: #2a5fa8; color: #9fc3ea; }
.start-btn:disabled { opacity: .4; cursor: not-allowed; }
.start-panel .save-meta { margin-top: 20px; font-size: 11px; color: #5c6774; line-height: 1.7; }
.settings-panel h2 { font-size: 16px; letter-spacing: 3px; color: #e8c15a; margin-bottom: 16px; display: flex; justify-content: space-between; }
.settings-panel .close-x { background: none; border: none; color: #7d8b9b; font-size: 20px; cursor: pointer; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #232c36; gap: 16px; }
.setting-row select { background: #1c242e; border: 1px solid #2b3641; border-radius: 4px; color: #dbe3ec; font-size: 12px; padding: 5px 10px; }
.save-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.save-actions .btn { flex: 1 1 100px; width: auto; padding: 8px 12px; text-align: center; }
.save-info { font-size: 11px; color: #5c6774; margin-top: 12px; line-height: 1.7; background: #12171d; padding: 8px 12px; border-radius: 6px; }
.endgame-panel { min-width: 400px; text-align: center; }
#endgame-title { font-size: 24px; letter-spacing: 4px; margin-bottom: 8px; color: #e8c15a; }
#endgame-title.victory { color: #3fd07d; } #endgame-title.defeat { color: #ff6b6b; }
#endgame-reason { font-size: 14px; color: #8393a4; margin-bottom: 20px; line-height: 1.6; }
.endgame-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; text-align: left; }
.endgame-stats .es-item { padding: 10px 14px; background: #12171d; border-radius: 6px; }
.endgame-stats .es-k { font-size: 11px; color: #7d8b9b; }
.endgame-stats .es-v { font-size: 18px; font-weight: 700; color: #eaf1f8; font-family: Consolas, monospace; }
.endgame-stats .es-v.gold { color: #ffd75e; }
.event-panel { min-width: 480px; }
.event-title { font-size: 20px; letter-spacing: 3px; color: #e8c15a; margin-bottom: 12px; }
.event-desc { font-size: 14px; color: #dbe3ec; line-height: 1.7; margin-bottom: 20px; }
.event-options { display: flex; flex-direction: column; gap: 8px; }
.event-option { padding: 10px 14px; background: #232c37; border: 1px solid #33414f; border-radius: 6px; color: #dbe3ec; font-size: 13px; text-align: left; cursor: pointer; font-family: inherit; }
.event-option:hover { background: #2f3b49; border-color: #4a5b6d; }
.event-option .opt-effect { display: block; font-size: 11px; color: #9fc3ea; margin-top: 3px; }
#toast-container { position: fixed; top: 70px; right: 20px; z-index: 2500; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: #161b22; border: 1px solid #3d5266; border-radius: 6px; padding: 8px 14px; font-size: 12px; color: #eaf1f8; box-shadow: 0 4px 16px rgba(0,0,0,.5); animation: toastIn .3s ease; }
.toast.good { border-color: #27AE60; }
.toast.war { border-color: #a8312a; color: #ff8a8a; }
.toast.tech { border-color: #2a5fa8; color: #9fc3ea; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
.general-card { background: #151b22; border: 1px solid #232c36; border-left: 3px solid #6b4a9a; border-radius: 5px; padding: 6px 8px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
.general-card .g-name { font-weight: 700; color: #eaf1f8; }
.general-card .g-trait { font-size: 10px; color: #c9a5ff; font-style: italic; }
.general-card .g-mods { font-size: 10px; color: #8393a4; }
.general-card .g-mod-atk { color: #ff8a8a; }
.general-card .g-mod-def { color: #9fc3ea; }
.general-card.assigned { opacity: .45; }
.nation-list-scroll { max-height: 400px; overflow-y: auto; }

const POLITICAL_ACTIONS = [
  { id: "boostFocus", name: "加速国策", cost: 25, condition: n => !!n.focusCurrent, effect: n => { n.focusProgress += 10; } },
  { id: "emergencyRecruit", name: "紧急动员", cost: 30, effect: n => { n.manpower += 20000; } },
  { id: "boostWarSupport", name: "宣传战争", cost: 35, effect: n => { n.warSupport = Math.min(1, n.warSupport + 0.05); } },
  { id: "boostStability", name: "提振民心", cost: 40, effect: n => { n.stability = Math.min(1, n.stability + 0.05); } },
  { id: "rushBuild", name: "加速建造", cost: 50, condition: n => !!n.buildQueue, effect: n => { if (n.buildQueue) n.buildQueue.progress += 200; } },
  { id: "emergencyEquip", name: "紧急采购", cost: 60, effect: n => { n.equipStock += 150; } },

function doPoliticalAction(id) {
  const a = POLITICAL_ACTIONS.find(x => x.id === id); if (!a) return;
  const n = getPlayerNation(); if (n.politicalPower < a.cost) return;
  if (a.condition && !a.condition(n)) return;
  n.politicalPower -= a.cost; a.effect(n); log(`政治行动：${a.name}`, "diplo"); toast(a.name, "good"); renderAll();

const FW = 110, FH = 54, F_CG = 16, F_RG = 16, F_PAD = 16;
function renderFocusTree() {
  const n = getPlayerNation(), fs = getFocuses(n.id);
  while ($focusTreeSvg.firstChild) $focusTreeSvg.removeChild($focusTreeSvg.firstChild);
  $focusTreeNodes.innerHTML = "";
  const legend = document.getElementById("focus-legend");
  const seen = new Set();
  let lh = "";
  for (const f of fs) { if (seen.has(f.pathLabel)) continue; seen.add(f.pathLabel); lh += `<span><span class="lg-dot" style="background:${f.pathColor}"></span>${f.pathLabel}</span>`; }
  legend.innerHTML = lh;
  if (!fs.length) { $focusTreeNodes.innerHTML = `<div class="empty">无国策</div>`; return; }
  let mc = 0, mr = 0;
  for (const f of fs) { mc = Math.max(mc, f.position.col); mr = Math.max(mr, f.position.row); }
  const W = F_PAD * 2 + mc * (FW + F_CG) + FW, H = F_PAD * 2 + mr * (FH + F_RG) + FH;
  const canvas = document.getElementById("focus-tree-canvas");
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  $focusTreeSvg.setAttribute("width", W); $focusTreeSvg.setAttribute("height", H); $focusTreeSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const nL = f => F_PAD + f.position.col * (FW + F_CG), nT = f => F_PAD + f.position.row * (FH + F_RG);
  for (const f of fs) for (const pre of f.prerequisites) {
    const pr = fs.find(x => x.id === pre); if (!pr) continue;
    const x1 = nL(pr) + FW, y1 = nT(pr) + FH / 2, x2 = nL(f), y2 = nT(f) + FH / 2;
    const cx = (x1 + x2) / 2;
    const line = svgEl("path", { d: `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`, class: "focus-line" + (n.focusDone.includes(pre) ? " done" : "") });
    $focusTreeSvg.appendChild(line);
  }
  for (const f of fs) {
    const st = getFocusStatus(n, f), act = n.focusCurrent === f.id, done = n.focusDone.includes(f.id), sel = state.selectedFocusId === f.id;
    const node = document.createElement("div");
    node.className = `focus-node ${st}${sel ? " selected" : ""}`;
    node.dataset.fid = f.id; node.style.left = nL(f) + "px"; node.style.top = nT(f) + "px"; node.style.borderLeftColor = f.pathColor;
    const tips = f.effects.map(e => "· " + describeEffect(e)).join("\n");
    node.dataset.tip = `${f.name}（${f.pathLabel}）\n${f.description}\n\n耗时 ${f.cost} 天 · 政治 ${f.ppCost}\n\n${tips}`;
    let inner = `<div class="focus-title">${f.name}</div>`;

/* ========== 外交栏（3-Tab 彻底重做） ========== */
function renderDiplomacyPanel() {
  if ($diplomacyPanel.parentElement.classList.contains("hidden")) return;
  try {
    const n = getPlayerNation();
    const neighborIds = new Set(getAdjacentNations(n.id));
    const allOthers = Object.values(COUNTRIES).filter(c => c.id !== n.id);
    const warNations = n.wars.map(id => COUNTRIES[id]).filter(Boolean);
    const neighborNations = allOthers.filter(c => neighborIds.has(c.id) && !n.wars.includes(c.id) && !c.surrendered);
    const otherNations = allOthers.filter(c => !neighborIds.has(c.id) && !n.wars.includes(c.id) && !c.surrendered);
    const surrendered = allOthers.filter(c => c.surrendered);

    const renderRow = (c, mode) => {
      const r = n.relations[c.id] || 0;
      const hp = hasActivePact(n.id, c.id);
      const pd = hp ? n.nonAggressionPacts[c.id] - state.dayCount : 0;
      const rc = r >= 30 ? "#3fd07d" : r <= -30 ? "#ff6b6b" : "#d6e1ec";
      let statusText = "", statusColor = "";
      if (mode === "war") { statusText = "⚔ 交战中"; statusColor = "#ff6b6b"; }
      else if (c.surrendered) { statusText = "已投降"; statusColor = "#5c6774"; }
      else if (hp) { statusText = `互不侵犯（${pd}天）`; statusColor = "#9fc3ea"; }
      else { statusText = "和平"; statusColor = "#7d8b9b"; }
      let btns = "";
      if (mode === "war") {
        const canPeace = canOfferPeace(n.id, c.id);
        btns = `<button class="btn teal small" data-peace="${c.id}" ${canPeace ? "" : "disabled"}>☮ 议和 ${canPeace ? '' : '(条件未满)'}</button>`;
      } else if (mode === "neighbor") {
        if (!hp) {
          btns += `<button class="btn danger small" data-declare="${c.id}" ${n.politicalPower < CONFIG.declareWarCost ? "disabled" : ""}>宣战（${CONFIG.declareWarCost}）</button>`;
          btns += `<button class="btn small" data-pact="${c.id}" ${n.politicalPower < CONFIG.nonAggressionCost ? "disabled" : ""}>互不侵犯（${CONFIG.nonAggressionCost}）</button>`;
        }
        btns += `<button class="btn small" data-improve="${c.id}" ${n.politicalPower < CONFIG.improveRelationsCost ? "disabled" : ""}>改善关系（${CONFIG.improveRelationsCost}）</button>`;
      }
      return `<div class="diplo-row${mode === "war" ? " at-war" : ""}${c.surrendered ? " surrendered-row" : ""}">
        <span class="swatch" style="background:${c.color}"></span>
        <div class="c-body">
          <div class="c-head"><span class="c-name">${c.name}</span><span class="c-badge" style="color:${statusColor}">${statusText}</span></div>
          <div class="c-line">关系 <span style="color:${rc};font-weight:600">${r > 0 ? "+" + r : r}</span> · 兵力 ${getNationPower(c)} · 国策 ${c.focusDone.length}/50</div>
          ${btns ? `<div style="margin-top:6px">${btns}</div>` : ""}
        </div>
      </div>`;
    };

    const tab = state.diploTab;
    const tabsHtml = `
      <div class="diplo-tabs">
        <button class="diplo-tab war ${tab === "war" ? "active" : ""}" data-dtab="war">⚔ 交战 (${warNations.length})</button>
        <button class="diplo-tab neighbor ${tab === "neighbor" ? "active" : ""}" data-dtab="neighbor">🏴 邻国 (${neighborNations.length})</button>
        <button class="diplo-tab ${tab === "other" ? "active" : ""}" data-dtab="other">🌍 其他 (${otherNations.length + surrendered.length})</button>
      </div>`;

    let contentHtml = "";
    if (tab === "war") {
      contentHtml = warNations.length ? warNations.map(c => renderRow(c, "war")).join("") : "<div class='empty'>目前未与任何国家交战</div>";
    } else if (tab === "neighbor") {
      const filtered = state.diploSearch ? neighborNations.filter(c => c.name.toLowerCase().includes(state.diploSearch.toLowerCase())) : neighborNations;
      contentHtml = filtered.length ? filtered.map(c => renderRow(c, "neighbor")).join("") : "<div class='empty'>" + (neighborNations.length ? "无匹配结果" : "无邻国") + "</div>";
    } else {
      const allNonWar = otherNations.concat(surrendered);
      const filtered = state.diploSearch ? allNonWar.filter(c => c.name.toLowerCase().includes(state.diploSearch.toLowerCase())) : allNonWar;
      contentHtml = filtered.length ? filtered.map(c => renderRow(c, c.surrendered ? "war" : "other")).join("") : "<div class='empty'>无其他国家</div>";
    }

    $diplomacyPanel.innerHTML = `
      <div class="prov-head" style="margin-bottom:8px"><span class="swatch big" style="background:${n.color}"></span><div><div class="prov-name">${n.name}</div><div class="prov-owner" style="color:${n.color}">外交概览</div></div></div>
      <div class="stat-grid">
        <div class="stat"><span class="k">政治点数</span><span class="v gold">${n.politicalPower.toFixed(1)}</span></div>
        <div class="stat"><span class="k">战支</span><span class="v">${(n.warSupport*100).toFixed(0)}%</span></div>
      </div>
      <div class="sec-title">搜索（当前 Tab 内）</div>
      <input type="text" class="diplo-search" placeholder="🔍 输入国家名..." id="diplo-search-input" value="${state.diploSearch}">
      ${tabsHtml}
      <div class="diplo-list" style="max-height:480px;overflow-y:auto">${contentHtml}</div>
    `;

    $diplomacyPanel.querySelectorAll("[data-dtab]").forEach(b => b.addEventListener("click", () => {
      state.diploTab = b.dataset.dtab;
      state.diploSearch = "";
      renderDiplomacyPanel();
    }));
    const searchInput = document.getElementById("diplo-search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        state.diploSearch = e.target.value;
        const tab = state.diploTab, search = state.diploSearch;
        renderDiplomacyPanel();
        const inp = document.getElementById("diplo-search-input");
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    }
    $diplomacyPanel.querySelectorAll("[data-declare]").forEach(b => b.addEventListener("click", () => {
      const targetId = b.dataset.declare;
      const myProvs = PROVINCES.filter(p => p.owner === n.id);
      const enemies = PROVINCES.filter(p => p.owner === targetId);
      let goals = [];
      for (const mp of myProvs) for (const ep of enemies) if (mp.neighbors.includes(ep.id)) { goals.push(ep.id); if (goals.length >= 2) break; }
      const r = declareWar(n.id, targetId, goals);
      if (!r.ok) log(`宣战失败：${r.reason}`, "war"); else { toast(`宣战：${COUNTRIES[targetId].name}`, "war"); renderAll(); }
    }));
    $diplomacyPanel.querySelectorAll("[data-pact]").forEach(b => b.addEventListener("click", () => { const r = makePact(n.id, b.dataset.pact); if (!r.ok) log(`签约失败：${r.reason}`); else { toast("签约成功", "good"); renderAll(); } }));
    $diplomacyPanel.querySelectorAll("[data-improve]").forEach(b => b.addEventListener("click", () => { const r = improveRelations(n.id, b.dataset.improve); if (!r.ok) log(`改善失败：${r.reason}`); else renderAll(); }));
    $diplomacyPanel.querySelectorAll("[data-peace]").forEach(b => b.addEventListener("click", () => { offerPeace(n.id, b.dataset.peace, state.warGoals[n.id] || []); renderAll(); }));
  } catch (e) {
    console.error("renderDiplomacyPanel 出错", e);
    $diplomacyPanel.innerHTML = `<h2>外交</h2><div class='empty'>加载失败：${e.message}</div>`;
  }
}

function log(text, type) { state.logs.unshift({ dateStr: formatDate(state.dayCount), text, type }); if (state.logs.length > 60) state.logs.pop(); renderLogs(); }
function renderLogs() {
  if (!state.logs.length) { $logbar.innerHTML = `<div class="log-line"><span class="log-day">${formatDate(state.dayCount)}</span>游戏开始</div>`; return; }
  $logbar.innerHTML = state.logs.slice(0, 15).map(l => `<div class="log-line ${l.type || ""}"><span class="log-day">${l.dateStr}</span><span>${l.text}</span></div>`).join("");
}

// ⚠️ 关键修复：每个渲染函数独立 try-catch，一个失败不影响其他
function renderAll() {
  const safe = (fn, name) => { try { fn(); } catch (e) { console.error(`[renderAll] ${name} 出错:`, e); } };
  safe(renderTopbar, "renderTopbar");
  safe(renderCountryList, "renderCountryList");
  safe(updateProvinceColors, "updateProvinceColors");
  safe(() => { const gu = document.getElementById("layer-units"); if (gu) renderMapUnits(gu); }, "renderMapUnits");
  safe(() => renderProvinceDetail(state.selectedProvinceId), "renderProvinceDetail");
  if (state.activeTab === "production") safe(renderProductionPanel, "renderProductionPanel");
  if (state.activeTab === "focus") { safe(renderFocusTree, "renderFocusTree"); safe(renderFocusDetail, "renderFocusDetail"); safe(renderFocusSummary, "renderFocusSummary"); }
  if (state.activeTab === "tech") safe(renderTechPanel, "renderTechPanel");
  if (state.activeTab === "military") safe(renderMilitaryPanel, "renderMilitaryPanel");
  if (state.activeTab === "diplomacy") safe(renderDiplomacyPanel, "renderDiplomacyPanel");
}

  const el = ev.target.closest("[data-tip]");
  if (el && el.dataset.tip) {
    $tooltip.textContent = el.dataset.tip; $tooltip.classList.remove("hidden");
    let x = ev.clientX + 14, y = ev.clientY + 16; const r = $tooltip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - 12;
    $tooltip.style.left = x + "px"; $tooltip.style.top = y + "px";
  } else $tooltip.classList.add("hidden");
});

let isDragging = false, dragStart = null, dragStartView = null;
$map.addEventListener("mousedown", (ev) => {
  if (ev.target.tagName === "polygon") return;
  isDragging = true; $map.classList.add("dragging");
  const rect = $map.getBoundingClientRect();
  dragStart = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  dragStartView = { x: state.viewBox.x, y: state.viewBox.y };
});
document.addEventListener("mousemove", (ev) => {
  if (!isDragging) return;
  const rect = $map.getBoundingClientRect();
  const cur = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const rx = state.viewBox.w / rect.width, ry = state.viewBox.h / rect.height;
  state.viewBox.x = dragStartView.x - (cur.x - dragStart.x) * rx;
  state.viewBox.y = dragStartView.y - (cur.y - dragStart.y) * ry;
  applyZoom();
});
document.addEventListener("mouseup", () => { isDragging = false; $map.classList.remove("dragging"); });
$map.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const factor = ev.deltaY > 0 ? 1.15 : 0.87;
  const rect = $map.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const wx = state.viewBox.x + mx / rect.width * state.viewBox.w;
  const wy = state.viewBox.y + my / rect.height * state.viewBox.h;
  state.viewBox.w *= factor; state.viewBox.h *= factor;
  state.viewBox.x = wx - mx / rect.width * state.viewBox.w;
  state.viewBox.y = wy - my / rect.height * state.viewBox.h;
  applyZoom();
}, { passive: false });
document.getElementById("btn-zoom-in").addEventListener("click", () => { const cx = state.viewBox.x + state.viewBox.w/2, cy = state.viewBox.y + state.viewBox.h/2; state.viewBox.w *= 0.8; state.viewBox.h *= 0.8; state.viewBox.x = cx - state.viewBox.w/2; state.viewBox.y = cy - state.viewBox.h/2; applyZoom(); });
document.getElementById("btn-zoom-out").addEventListener("click", () => { const cx = state.viewBox.x + state.viewBox.w/2, cy = state.viewBox.y + state.viewBox.h/2; state.viewBox.w *= 1.25; state.viewBox.h *= 1.25; state.viewBox.x = cx - state.viewBox.w/2; state.viewBox.y = cy - state.viewBox.h/2; applyZoom(); });
document.getElementById("btn-zoom-reset").addEventListener("click", () => { state.viewBox = { x: 0, y: 0, w: MAP_W, h: MAP_H }; applyZoom(); });

let clockTimer = null;
function setSpeed(sp) {
  if (state.gameEnded) { state.speed = 0; renderTopbar(); return; }
  state.speed = sp;
  if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
  if (sp > 0) scheduleNextTick();
  renderTopbar();
}
function scheduleNextTick() {
  const ms = CONFIG.baseTickMs / state.speed;
  clockTimer = setTimeout(() => { gameTick(); if (state.speed > 0 && !state.gameEnded) scheduleNextTick(); }, ms);
}
function gameTick() {
  if (state.gameEnded || state.pendingEvent) return;
  state.tick += 1;
  if (state.tick % CONFIG.ticksPerDay === 0) { state.dayCount += 1; dailySettlement(); renderTopbar(); }
}
const $setOverlay = document.getElementById("settings-overlay");
function openSettings() { document.getElementById("set-speed").value = String(settings.defaultSpeed); document.getElementById("set-sound").value = settings.soundEnabled ? "1" : "0"; updateSaveInfoUI(); $setOverlay.classList.remove("hidden"); }
function closeSettings() { $setOverlay.classList.add("hidden"); }
document.getElementById("set-speed").addEventListener("change", ev => { const v = Number(ev.target.value); settings.defaultSpeed = v; saveSettings(); if (!state.gameEnded) setSpeed(v); });
document.getElementById("set-sound").addEventListener("change", ev => { settings.soundEnabled = ev.target.value === "1"; saveSettings(); });
document.getElementById("btn-save").addEventListener("click", () => { const ok = saveGame(false); if (ok) { log("手动保存成功", "good"); toast("已保存", "good"); } });
document.getElementById("btn-load").addEventListener("click", () => { if (!hasSave()) { alert("无存档"); return; } if (!confirm("读取存档？")) return; closeSettings(); const r = loadSaveData(); if (r.ok) { buildMap(); renderAll(); checkGameEnd(); setSpeed(1); log("已读取存档", "good"); } else alert(r.reason); });
document.getElementById("btn-delete-save").addEventListener("click", () => { if (!confirm("删除存档？")) return; deleteSave(); log("已删除", "info"); });
document.getElementById("btn-back-menu").addEventListener("click", () => { if (!confirm("回到主菜单？")) return; closeSettings(); location.reload(); });
document.getElementById("btn-close-settings").addEventListener("click", closeSettings);

const $startOverlay = document.getElementById("start-overlay");
function showStartMenu() {
  const grid = document.getElementById("nation-grid");
  grid.innerHTML = Object.values(COUNTRIES).map(c => `
    <div class="ng-item" data-nid="${c.id}">
      <div class="ng-color" style="background:${c.color}"></div>
      <div class="ng-name">${c.name}</div>
      <div class="ng-info">${IDEOLOGY[c.ideology]} · ${c.civilianFactories}/${c.militaryFactories}</div>
    </div>
  `).join("");
  grid.querySelectorAll(".ng-item").forEach(item => item.addEventListener("click", () => {
    grid.querySelectorAll(".ng-item").forEach(x => x.classList.remove("selected"));
    item.classList.add("selected");
    state.playerNationId = item.dataset.nid;
  }));
  const def = grid.querySelector(`[data-nid="asteria"]`);
  if (def) def.classList.add("selected");
  const meta = getSaveMeta(), me = document.getElementById("start-save-meta");
  if (meta && meta.version === SAVE_VERSION) {
    const d = new Date(meta.savedAt);
    const ts = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const nn = COUNTRIES[meta.playerNationId] ? COUNTRIES[meta.playerNationId].name : meta.playerNationId;
    me.innerHTML = `存档：${ts}<br>日期：${formatDate(meta.dayCount)} · ${nn}`;
    document.getElementById("btn-start-continue").disabled = false;
  } else {
    me.innerHTML = "没有存档";
    document.getElementById("btn-start-continue").disabled = true;
  }
  $startOverlay.classList.remove("hidden");
}
document.getElementById("btn-start-new").addEventListener("click", () => {
  $startOverlay.classList.add("hidden");
  localStorage.removeItem(SAVE_KEY);
  const playerId = state.playerNationId;
  initNations();
  state.playerNationId = playerId;
  buildMap();
  renderAll();
  setSpeed(settings.defaultSpeed || 1);
  log(`游戏开始 · ${COUNTRIES[state.playerNationId].name}`, "info");
  log(`你控制 ${PROVINCES.filter(p => p.owner === state.playerNationId).length} 省，${(GENERALS[state.playerNationId] || []).length} 将领`, "diplo");
  log("提示：滚轮缩放 · 拖动平移 · 空格暂停 · Q 全选 · 1-6 切标签", "diplo");
  log("胜利：控制 60% 胜利点 或 所有其他国投降", "diplo");
});
document.getElementById("btn-start-continue").addEventListener("click", () => {
  $startOverlay.classList.add("hidden");
  const r = loadSaveData();
  if (r.ok) { buildMap(); switchTab(state.activeTab); renderAll(); checkGameEnd(); setSpeed(1); log("已读取存档", "good"); }
  else alert(r.reason || "存档损坏");
});

function init() {
  loadSettings();
  state.viewBox = { x: 0, y: 0, w: MAP_W, h: MAP_H };
  initNations();
  buildMap();
  // ⚠️ 关键修复：init 末尾渲染一次侧栏，避免开始前空白
  renderTopbar();
  renderCountryList();
  renderProvinceDetail(null);
  renderLogs();
  document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  document.querySelectorAll(".speed-btn[data-speed]").forEach(b => b.addEventListener("click", () => setSpeed(Number(b.dataset.speed))));
  document.getElementById("btn-settings").addEventListener("click", openSettings);
  document.getElementById("btn-restart").addEventListener("click", () => { document.getElementById("endgame-overlay").classList.add("hidden"); localStorage.removeItem(SAVE_KEY); location.reload(); });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { if (!$setOverlay.classList.contains("hidden")) { closeSettings(); return; } if (!document.getElementById("event-overlay").classList.contains("hidden")) return; if (!$startOverlay.classList.contains("hidden")) return; selectProvince(null); if (state.highlightCountryId) toggleCountryFilter(state.highlightCountryId); }
    else if (ev.code === "Space") { if (!$setOverlay.classList.contains("hidden") || !$startOverlay.classList.contains("hidden") || !document.getElementById("event-overlay").classList.contains("hidden")) return; if (!document.getElementById("endgame-overlay").classList.contains("hidden")) return; ev.preventDefault(); if (!state.gameEnded) setSpeed(state.speed === 0 ? 1 : 0); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") { ev.preventDefault(); saveGame(false); }
    else if (ev.key === "q" || ev.key === "Q") { if (state.selectedProvinceId) selectAllDivisionsInProvince(state.selectedProvinceId); }
    else if (ev.key === "w" || ev.key === "W") { clearDivisionSelection(); }
    else if (ev.key === "1") switchTab("province");
    else if (ev.key === "2") switchTab("production");
    else if (ev.key === "3") switchTab("focus");
    else if (ev.key === "4") switchTab("tech");
    else if (ev.key === "5") switchTab("military");
    else if (ev.key === "6") switchTab("diplomacy");
  });
  showStartMenu();
}
init();
</script>
